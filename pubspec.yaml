name: waypoint_alarm
description: "GPS proximity alarm"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audio_session: ^0.2.3
  dart_mappable: ^4.8.0
  dio_cache_interceptor: ^4.0.6
  drift: any
  drift_flutter: ^0.2.8
  file_picker: any
  flutter:
    sdk: flutter
  flutter_foreground_task: ^9.0.0
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.0
  flutter_map_cache: ^2.1.0
  flutter_map_location_marker: ^10.0.0
  flutter_riverpod: ^3.0.0
  geolocator: ^14.0.0
  go_router: any
  haptic_feedback: any
  http: any
  http_cache_file_store: ^2.0.1
  intl: any
  just_audio: any
  latlong2: any
  path: any
  path_provider: any
  permission_handler: any
  riverpod_annotation: ^3.0.0
  shared_preferences: any
  sqlite3_flutter_libs: any
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: any
  custom_lint: any
  dart_mappable_builder: ^4.7.0
  drift_dev: any
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
